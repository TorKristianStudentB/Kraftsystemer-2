const map = L.map('map',{preferCanvas:true}).setView([63,15],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const vColor=v=>v>=380?'#d00000':v>=300?'#f48c06':v>=220?'#2a9d8f':'#4895ef';
const vWeight=v=>v>=380?3.2:v>=300?2.6:v>=220?2.0:1.4;
const gColor={Hydro:'#0077b6',Thermal:'#6c757d',Nuclear:'#e85d04'};
const gLines=L.layerGroup(),gTrafo=L.layerGroup(),gBus=L.layerGroup(),gGen=L.layerGroup(),gLoad=L.layerGroup(),gLink=L.layerGroup();
DATA.lines.forEach(l=>L.polyline(l.p,{color:vColor(l.V),weight:vWeight(l.V),opacity:.85}).bindPopup(`<b>AC-linje</b><br>${l.a} &rarr; ${l.b}<br>${l.V} kV`).addTo(gLines));
DATA.links.forEach(k=>L.polyline(k.p,{color:'#8338ec',weight:3,dashArray:'7 6',opacity:.9}).bindPopup(`<b>HVDC</b><br>${k.name}`).addTo(gLink));
DATA.buses.forEach(b=>L.circleMarker([b.lat,b.lon],{radius:3,color:'#222',weight:1,fillColor:'#fff',fillOpacity:.9}).bindPopup(`<b>Buss ${b.id}</b><br>${b.name}<br>${b.bidz} &middot; ${b.V} kV<br>Last: ${b.load} MW`).addTo(gBus));
DATA.buses.forEach(b=>{if(b.load>0)L.circleMarker([b.lat,b.lon],{radius:2+Math.sqrt(b.load)*0.45,color:'#9d4edd',weight:0,fillColor:'#9d4edd',fillOpacity:.35}).bindPopup(`<b>Last</b><br>Buss ${b.id} (${b.bidz})<br>${b.load} MW`).addTo(gLoad);});
DATA.gens.forEach(g=>L.circleMarker([g.lat,g.lon],{radius:2+Math.sqrt(g.Pmax)*0.5,color:'#222',weight:.5,fillColor:gColor[g.type]||'#999',fillOpacity:.8}).bindPopup(`<b>${g.name}</b><br>${g.type}<br>Pmax: ${g.Pmax} MW<br>P: ${g.P} MW`).addTo(gGen));
const tfIcon=L.divIcon({className:'',html:'<div class="tf"></div>',iconSize:[9,9]});
DATA.trafos.forEach(t=>L.marker([t.lat,t.lon],{icon:tfIcon}).bindPopup(`<b>Transformator</b><br>${t.a} &harr; ${t.b}<br>ratio: ${t.ratio}`).addTo(gTrafo));

L.control.layers(null,{'AC-linjer':gLines,'HVDC-kabler':gLink,'Generatorer':gGen,'Busser':gBus,'Laster':gLoad,'Transformatorer':gTrafo},{collapsed:false}).addTo(map);
